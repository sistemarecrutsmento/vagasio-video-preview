<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VagasIO — Ambiente de teste</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#f8f7f8;background:#0f0e11}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#2b1821,#0f0e11 58%)}main{width:min(780px,100%)}.brand{font-size:24px;font-weight:800;margin-bottom:34px}.brand em{color:#d26a8f;font-style:normal}.tag{display:inline-block;color:#ffbed3;background:#4d2134;border:1px solid #8e4162;border-radius:99px;padding:6px 11px;font-size:12px;font-weight:700;margin-bottom:14px}h1{font-size:clamp(28px,5vw,46px);line-height:1.05;margin:0 0 14px}p{color:#b9b1b7;line-height:1.55}.note{font-size:13px;margin:22px 0 28px}.roles{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}@media(max-width:600px){.roles{grid-template-columns:1fr}}button{width:100%;text-align:left;padding:22px;border:1px solid #4c3b43;border-radius:15px;background:#21171d;color:#fff;cursor:pointer;font:inherit}button:hover{border-color:#d26a8f;background:#2a1b23}button:disabled{opacity:.6;cursor:wait}.role{font-size:18px;font-weight:800}.desc{display:block;color:#b9b1b7;font-size:13px;margin-top:7px}.status{min-height:22px;margin-top:20px;color:#ffbed3;font-size:13px}
</style></head><body><main><div class="brand">Vagas<em>IO</em></div><span class="tag">AMBIENTE ISOLADO DE TESTE</span><h1>Teste da entrevista por vídeo</h1><p>Escolha o papel desta sessão. O sistema vai preparar automaticamente a mesma entrevista de teste para o recrutador e o candidato.</p><p class="note">Este ambiente não usa contas da produção e não é a versão antiga do Teams.</p><section class="roles"><button data-role="recruiter"><span class="role">Entrar como recrutador</span><span class="desc">Abrir a sala e iniciar a entrevista</span></button><button data-role="candidate"><span class="role">Entrar como candidato</span><span class="desc">Participar da entrevista de teste</span></button></section><div class="status" id="status" role="status"></div></main><script>
const API='https://vagasio-video-api-preview.onrender.com',status=document.querySelector('#status');document.querySelectorAll('button').forEach(b=>b.onclick=async()=>{document.querySelectorAll('button').forEach(x=>x.disabled=true);status.textContent='Preparando sua sessão de teste…';try{const r=await fetch(API+'/api/video/preview-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:b.dataset.role})});const d=await r.json();if(!r.ok||!d.token)throw Error(d.erro||'Não foi possível preparar a sessão');sessionStorage.setItem('vagasio_video_interview_id',String(d.interviewId));localStorage.setItem(b.dataset.role==='candidate'?'candidato_token':'empresa_token',d.token);location.href=(b.dataset.role==='candidate'?'candidato':'empresa')+'/video-call.html'}catch(e){status.textContent=e.message;document.querySelectorAll('button').forEach(x=>x.disabled=false)}});
</script></body></html>
